<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SEOdyssey{% endblock %}</title>
  <style>
    @media only screen and (max-width: 600px) {
      .container { width: 100% !important; }
      .px { padding-left: 22px !important; padding-right: 22px !important; }
      .cta { display: block !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; background:#f4f2ec; -webkit-font-smoothing:antialiased;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f2ec;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" class="container" width="560" cellpadding="0" cellspacing="0" style="width:560px; max-width:560px; background:#ffffff; border-radius:18px; border:1px solid rgba(21,20,15,0.09); overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

          <!-- Хедер -->
          <tr>
            <td class="px" style="padding:28px 36px 20px; border-bottom:1px solid rgba(21,20,15,0.06);">
              <span style="font-size:16px; font-weight:700; color:#15140f; letter-spacing:-0.3px;">SEOdyssey</span>
              <span style="font-size:11px; color:#9a958b; letter-spacing:0.3px;"> · мониторинг сайтов</span>
            </td>
          </tr>

          {% block content %}{% endblock %}

          <!-- Футер -->
          <tr>
            <td class="px" style="padding:20px 36px; background:#f9f8f4; border-top:1px solid rgba(21,20,15,0.06);">
              <p style="margin:0; font-size:12px; color:#9a958b; line-height:1.5;">SEOdyssey — SEO и видимость сайтов в нейропоиске.<br><a href="{{ site_url }}" style="color:#6b675e; text-decoration:none;">seodyssey.ru</a> · <a href="{% verbatim %}{{UnsubscribeUrl}}{% endverbatim %}" style="color:#c9c5bb; text-decoration:none;">отписаться</a></p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
