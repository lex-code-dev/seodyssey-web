{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}SEOdyssey{% endblock %}</title>
  <meta name="description" content="{% block description %}SEOdyssey — мониторинг сайтов и инструменты для SEO{% endblock %}">

  <link rel="icon" href="{% static 'core/favicon.ico' %}" sizes="any">
  <link rel="icon" href="{% static 'core/favicon.svg' %}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{% static 'core/favicon-32.png' %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] },
          colors: {
            brand: { DEFAULT: '#3d5bf5', hover: '#2f4de0', light: '#eef0fe', text: '#2d4fd6' }
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=2">

  {% block head %}{% endblock %}

  <script type="text/javascript">
    (function(m,e,t,r,i,k,a){
      m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
      m[i].l=1*new Date();
      for(var j=0;j<document.scripts.length;j++){if(document.scripts[j].src===r){return;}}
      k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
    })(window,document,'script','https://mc.yandex.ru/metrika/tag.js?id=108669492','ym');
    ym(108669492,'init',{ssr:true,webvisor:true,clickmap:true,ecommerce:"dataLayer",referrer:document.referrer,url:location.href,accurateTrackBounce:true,trackLinks:true});
  </script>
  <noscript><div><img src="https://mc.yandex.ru/watch/108669492" style="position:absolute;left:-9999px;" alt="" /></div></noscript>
{% block extra_css %}{% endblock %}
</head>
<body class="font-sans">
  {% include "ui/components/topbar.html" %}
  <div class="flex min-h-screen">
    {% include "ui/components/sidebar.html" %}
    <main class="flex-1 min-w-0 overflow-x-hidden">
      <div class="max-w-6xl mx-auto px-6 py-8">
        {% include "ui/components/flash.html" %}
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
</body>
</html>
