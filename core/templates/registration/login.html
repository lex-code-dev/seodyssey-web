{% extends "ui/base.html" %}
{% block title %}Вход · SEOdyssey{% endblock %}

{% block content %}
<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="width:100%;max-width:400px;" class="card card-pad-lg">

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:28px;">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none"><circle cx="15" cy="15" r="14" fill="#1a1d2e"/><path d="M15 15 m0 -6.5 a6.5 6.5 0 1 1 -0.01 0" stroke="#6378ff" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M15 15 m0 -4 a4 4 0 1 1 -0.01 0" stroke="#6378ff" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.7"/><path d="M15 15 m0 -1.8 a1.8 1.8 0 1 1 -0.01 0" stroke="#6378ff" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.5"/><circle cx="15" cy="15" r="1" fill="#8fa3ff"/><line x1="15" y1="8.5" x2="17" y2="6.5" stroke="#6378ff" stroke-width="1.2" stroke-linecap="round"/></svg>
      <div>
        <div style="font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-0.015em;">SEOdyssey</div>
        <div style="font-size:10.5px;color:var(--muted-2);margin-top:1px;">мониторинг сайтов</div>
      </div>
    </div>

    <h1 class="page-title-sm" style="margin-bottom:20px;">Вход</h1>

    {% if form.errors %}
      <div style="margin-bottom:16px;padding:12px 14px;border:0.5px solid var(--fail-line);border-radius:10px;background:var(--fail-bg);font-size:13px;color:var(--fail-fg);">
        Неверный логин или пароль.
      </div>
    {% endif %}

    <form method="post" style="display:flex;flex-direction:column;gap:14px;">
      {% csrf_token %}

      <div>
        <label class="field-label" for="id_username">Логин</label>
        <input id="id_username" name="username" type="text" autocomplete="username" class="input" value="{{ form.username.value|default:'' }}">
      </div>

      <div>
        <label class="field-label" for="id_password">Пароль</label>
        <input id="id_password" name="password" type="password" autocomplete="current-password" class="input">
      </div>

      <input type="hidden" name="next" value="{{ next|default:'' }}">

      <button type="submit" class="btn-dark" style="width:100%;justify-content:center;padding:12px;font-size:14px;margin-top:4px;">
        Войти
      </button>
    </form>

    <div style="text-align:center;margin-top:16px;display:flex;flex-direction:column;gap:8px;">
      <a href="{% url 'register' %}" style="font-size:12px;color:var(--muted-2);text-decoration:none;">Нет аккаунта? Зарегистрироваться</a>
      <a href="{% url 'password_reset' %}" style="font-size:12px;color:var(--muted-2);text-decoration:none;">Забыли пароль?</a>
    </div>

  </div>
</div>
{% endblock %}
