{% extends "ui/base.html" %}
{% block title %}Привязка Метрики · SEOdyssey{% endblock %}

{% block content %}
<div style="display:flex;flex-direction:column;gap:14px;">

  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
    <div>
      <h1 style="font-size:22px;font-weight:700;letter-spacing:-0.3px;color:#111;">Привязка Яндекс Метрики</h1>
      <p style="font-size:13px;color:#aaa;margin-top:4px;">{{ site.name }} · {{ site.domain }}</p>
    </div>
    <a href="{% url 'site_checks' site.id %}" style="padding:8px 16px;border-radius:10px;border:0.5px solid #e5e5e3;background:#fff;font-size:13px;font-weight:600;color:#111;text-decoration:none;">← Назад</a>
  </div>

  <div class="card" style="max-width:520px;">
    <form method="post" style="display:flex;flex-direction:column;gap:16px;">
      {% csrf_token %}

      <div>
        <div style="font-size:12px;font-weight:600;color:#111;margin-bottom:6px;">Выбери счётчик</div>
        <select name="counter_id" required
                style="width:100%;padding:10px 14px;border-radius:10px;border:0.5px solid #e5e5e3;background:#f7f7f5;font-size:14px;outline:none;box-sizing:border-box;">
          <option value="" disabled selected>— выбрать —</option>
          {% for c in counters %}
            <option value="{{ c.id }}">{{ c.name }} ({{ c.site|default:"без сайта" }}) — id={{ c.id }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <button type="submit"
                style="padding:10px 24px;border-radius:10px;background:#111;color:#fff;font-size:13px;font-weight:600;border:none;cursor:pointer;">
          Сохранить
        </button>
      </div>

      <div id="loading" style="display:none;font-size:13px;color:#aaa;">
        Загружаем список счётчиков из Метрики...
      </div>
      <script>
        document.querySelector('form').addEventListener('submit', function() {
          document.getElementById('loading').style.display = 'block';
        });
      </script>
    </form>
  </div>

</div>
{% endblock %}
