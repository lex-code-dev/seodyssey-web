<div class="check-tile" title="{% if item.summary.lines %}{{ item.summary.lines|join:' · ' }}{% endif %}">
  <div class="head">
    <div class="name">{% if item.summary.title %}{{ item.summary.title }}{% else %}{{ key|upper }}{% endif %}</div>
    <span class="dotind {% if item.status == 'ok' %}ok{% elif item.status == 'warn' or item.status == 'warning' %}warn{% elif item.status == 'fail' %}fail{% else %}idle{% endif %}"></span>
  </div>
  {% if not item.status or item.status == 'skipped' or item.status == 'unknown' %}
    <span class="badge-muted" style="font-size:10.5px;">{{ item.status|default:"—"|upper }}</span>
  {% endif %}
</div>
