<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ lesson.title }} — Курс SEOdyssey</title>
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="icon" href="/static/img/spiral-icon.svg" type="image/svg+xml">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', system-ui, sans-serif; color: #15140F; background: #F7F4EE; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .cr-body { font-size: 17px; line-height: 1.7; color: #2C2A24; }
  .cr-body p { margin: 0 0 18px; }
  .cr-draft-banner { font-size: 13px; font-weight: 600; color: #B4552F; background: #FBEAE1; padding: 8px 14px; border-radius: 10px; display: inline-block; margin-bottom: 22px; }
  .cr-back { display: inline-block; margin-top: 40px; font-size: 14.5px; font-weight: 600; color: #6378FF; }
</style>
</head>
<body>
<nav style="position:sticky;top:0;z-index:50;backdrop-filter:saturate(180%) blur(14px);background:rgba(247,244,238,0.72);border-bottom:1px solid rgba(21,20,15,0.07);">
  <div style="max-width:760px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:20px;">
    <a href="/" style="display:flex;align-items:center;gap:11px;margin-right:auto;">
      <img src="/static/img/spiral-icon.svg" width="34" height="34" alt="SEOdyssey" style="display:block;">
      <span style="display:flex;flex-direction:column;line-height:1.05;">
        <span style="font-weight:700;font-size:17px;letter-spacing:-0.02em;">SEOdyssey</span>
        <span style="font-size:11px;color:#8A857A;font-weight:500;">видимость в нейросетях</span>
      </span>
    </a>
    <a href="{% url 'course:lesson_list' %}" style="font-size:14.5px;font-weight:500;color:#4A463E;">← Уроки</a>
  </div>
</nav>

<article style="max-width:760px;margin:0 auto;padding:clamp(40px,5vw,72px) 24px clamp(76px,8vw,110px);">
  {% if not lesson.is_published %}<div class="cr-draft-banner">Черновик — виден только staff</div>{% endif %}
  <h1 style="font-size:clamp(30px,4vw,46px);line-height:1.1;letter-spacing:-0.03em;font-weight:700;margin:0 0 28px;">{{ lesson.title }}</h1>
  <div class="cr-body">{{ lesson.body|linebreaks }}</div>
  <a class="cr-back" href="{% url 'course:lesson_list' %}">← ко всем урокам</a>
</article>
</body>
</html>
